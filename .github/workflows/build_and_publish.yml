name: Build and Publish to PyPI
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  # avoid build failures due to flaky pypi
  PIP_DEFAULT_TIMEOUT: 60
  PIP_RETRIES: 5

  # required otherwise github api calls are rate limited
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_ENV: ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.3.0
        with:
          bootstrap: true
          bootstrap_args: --update --yes
      - uses: iloveitaly/github-action-direnv-load-and-mask@master
      - run: uv sync
      - run: just lint
  
  matrix-test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Keep in sync with requires-python and project.classifiers in pyproject.toml
        python-version: ["3.14", "3.13", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # uv ignores `mise use` and picks a requires-python-compatible interpreter
      # (currently always 3.14 from mise.toml) unless UV_PYTHON is set.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.3.0
        with:
          bootstrap: true
          bootstrap_args: --update --yes
      - run: mise use python@${{ matrix.python-version }}
      - uses: iloveitaly/github-action-direnv-load-and-mask@master
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run python -c "import sys; expected=tuple(int(p) for p in '${{ matrix.python-version }}'.split('.')); assert sys.version_info[:len(expected)] == expected, sys.version"
      - run: uv run pytest

  release-please:
    needs: matrix-test
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: python
          token: ${{ secrets.GH_PERSONAL_TOKEN }}

  build-and-publish:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.3.0
        with:
          bootstrap: true
          bootstrap_args: --update --yes
      - uses: iloveitaly/github-action-direnv-load-and-mask@master
      - run: uv sync
      - run: uv build
      - run: uv publish
